name: anxious-s13-front-it
services:
  db:
    extends:
      file: compose.m3-test.yml
      service: db
  mock-github:
    extends:
      file: compose.m3-test.yml
      service: mock-github
    image: ${M3_FIXTURE_IMAGE:-anxious-hosting-api-m3-test}
    command: [uvicorn, tests.mock_github_m3:app, --host, 0.0.0.0, --port, "8080", --no-access-log]
  api:
    extends:
      file: ../infra/hosting/compose.test.yml
      service: api
    image: ${API_RUNTIME_IMAGE:?Build/set the reviewed runtime image}
    environment:
      AUTH_ORIGIN: http://127.0.0.1:${M3_GATEWAY_PORT:-18100}
      GITHUB_AUTHORIZE_URL: http://127.0.0.1:${M3_GATEWAY_PORT:-18100}/_fixture/github/authorize
      RESEARCH_ACCESS_POLICY: approved
      ADMIN_DATABASE_URL: ""  # Operator fixture credentials remain in explicit ops services.
      API_DATABASE_PASSWORD: ""
  migrate:
    extends:
      file: compose.m3-test.yml
      service: test
    image: ${M3_FIXTURE_IMAGE:-anxious-hosting-api-m3-test}
    profiles: [ops]
    command: [python, -m, app.migrate, --revision, 0003_sessions]
  admin:
    extends:
      file: compose.m3-test.yml
      service: test
    image: ${M3_FIXTURE_IMAGE:-anxious-hosting-api-m3-test}
    profiles: [ops]
    entrypoint: [python, -m, app.admin]
    command: []
  web:
    image: ${WEB_RUNTIME_IMAGE:?Build/set the frontend runtime image}
    environment: {PORT: "8080", HOSTNAME: "0.0.0.0"}
    read_only: true
    user: "10001:10001"
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [testing]
  gateway:
    image: rancher/mirrored-library-traefik:3.7.8@sha256:4299bbed850421258fc5448c2e0e6ad350981d4d335a68de11b92448aedbefe5
    command: [--entrypoints.web.address=:8080, --providers.file.filename=/etc/traefik/routes.yml, --api.dashboard=false]
    volumes: ["./tests/fixtures/m3-routes.yml:/etc/traefik/routes.yml:ro"]
    ports: ["127.0.0.1:${M3_GATEWAY_PORT:-18100}:8080"]
    read_only: true
    tmpfs: [/tmp]
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [testing, browser]
networks:
  testing:
    internal: true
  browser: {}
volumes:
  db-test-data:
