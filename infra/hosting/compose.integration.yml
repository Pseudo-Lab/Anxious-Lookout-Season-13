name: anxious-s13-back-test
services:
  api:
    image: ${API_RUNTIME_IMAGE:?Set tested API runtime image}
    environment:
      AUTH_ORIGIN: http://127.0.0.1:8080
  web:
    image: ${WEB_RUNTIME_IMAGE:?Set tested web image}
    environment:
      PORT: "8080"
      HOSTNAME: "0.0.0.0"
    read_only: true
    user: "10001:10001"
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [testing]
  gateway:
    image: rancher/mirrored-library-traefik:3.7.8@sha256:4299bbed850421258fc5448c2e0e6ad350981d4d335a68de11b92448aedbefe5
    command: [--entrypoints.web.address=:8080, --providers.file.filename=/etc/traefik/routes.yml, --api.dashboard=false]
    volumes:
      - ./compose-routes.yml:/etc/traefik/routes.yml:ro
    ports: ["127.0.0.1:28100:8080"]
    read_only: true
    tmpfs: [/tmp]
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [testing]
