name: anxious-s13-back-test
services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_PASSWORD: disposable-test-admin
      POSTGRES_DB: hosting_test
    volumes:
      - db-test-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d hosting_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [testing]
  mock-github:
    image: anxious-hosting-api-test
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: test
      args:
        APP_GIT_SHA: "0000000000000000000000000000000000000000"
        APP_BUILT_AT: "2026-10-06T00:00:00Z"
    command: [uvicorn, tests.mock_github:app, --host, 0.0.0.0, --port, "8080", --no-access-log]
    read_only: true
    tmpfs: [/tmp]
    networks: [testing]
  test:
    image: anxious-hosting-api-test
    depends_on:
      db: {condition: service_healthy}
      mock-github: {condition: service_started}
    environment: &test-environment
      APP_ENV: test
      ADMIN_DATABASE_URL: postgresql+psycopg://postgres:disposable-test-admin@db/hosting_test
      API_DATABASE_PASSWORD: disposable-api-password
      DATABASE_URL: postgresql+psycopg://anxious_api:disposable-api-password@db/hosting_test
      AUTH_ORIGIN: http://127.0.0.1:28080
      ALLOW_INSECURE_LOOPBACK: "true"
      OAUTH_MODE: mock
      GITHUB_CLIENT_ID: mock-id
      GITHUB_CLIENT_SECRET: mock-secret
      AUTH_TRANSACTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      GITHUB_AUTHORIZE_URL: http://mock-github:8080/authorize
      GITHUB_TOKEN_URL: http://mock-github:8080/token
      GITHUB_USER_URL: http://mock-github:8080/user
    read_only: true
    tmpfs: [/tmp]
    networks: [testing]
  api:
    image: anxious-hosting-api-test
    command: [uvicorn, app.main:create_app, --factory, --host, 0.0.0.0, --port, "8080", --workers, "1", --no-access-log, --no-proxy-headers]
    environment: *test-environment
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [testing]
networks:
  testing:
    internal: true
volumes:
  db-test-data:
